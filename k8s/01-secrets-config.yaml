apiVersion: v1
kind: ConfigMap
metadata:
  name: twitchnt-config
  namespace: twitchnt
data:
  PORT: "5000"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "twitchnt_db"
  DB_USER: "twitchnt"
  CORS_ORIGIN: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: twitchnt-secrets
  namespace: twitchnt
type: Opaque
stringData:
  POSTGRES_PASSWORD: "twitchnt_k8s_secret_password_2026"
  DATABASE_URL: "postgres://twitchnt:twitchnt_k8s_secret_password_2026@postgres-service:5432/twitchnt_db"
  JWT_SECRET: "twitchnt_k8s_production_jwt_secret_cloud_computing"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mediamtx-config
  namespace: twitchnt
data:
  mediamtx.yml: |
    logLevel: info
    logDestinations: [stdout]
    authMethod: http
    authHTTPAddress: http://backend-service:5000/api/mediamtx/auth
    api: yes
    apiAddress: :9997
    rtmp: yes
    rtmpAddress: :1935
    hls: yes
    hlsAddress: :8888
    hlsAllowOrigin: "*"
    hlsSegmentDuration: 1s
    hlsPartDuration: 200ms
    webrtc: yes
    webrtcAddress: :8889
    webrtcAllowOrigin: "*"
    rtsp: no
    pathDefaults:
      source: publisher
    paths:
      all_others:
        source: publisher
