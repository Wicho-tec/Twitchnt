apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediamtx
  namespace: twitchnt
  labels:
    app: mediamtx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mediamtx
  template:
    metadata:
      labels:
        app: mediamtx
    spec:
      containers:
        - name: mediamtx
          image: wichotecdocker/twitchnt-mediamtx:v1
          ports:
            - containerPort: 1935
              name: rtmp
            - containerPort: 8888
              name: hls
            - containerPort: 8889
              name: webrtc
            - containerPort: 9997
              name: api
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          volumeMounts:
            - name: config-volume
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
      volumes:
        - name: config-volume
          configMap:
            name: mediamtx-config
---
# Internal ClusterIP Service for Web Players (HLS / WebRTC / API)
apiVersion: v1
kind: Service
metadata:
  name: mediamtx-service
  namespace: twitchnt
  labels:
    app: mediamtx
spec:
  type: ClusterIP
  ports:
    - port: 8888
      targetPort: 8888
      name: hls
    - port: 8889
      targetPort: 8889
      name: webrtc
    - port: 9997
      targetPort: 9997
      name: api
  selector:
    app: mediamtx
---
# NodePort / LoadBalancer Service for OBS Studio RTMP Streaming (TCP 1935)
apiVersion: v1
kind: Service
metadata:
  name: mediamtx-rtmp-service
  namespace: twitchnt
  labels:
    app: mediamtx
spec:
  type: NodePort
  ports:
    - port: 1935
      targetPort: 1935
      nodePort: 31935
      protocol: TCP
      name: rtmp
  selector:
    app: mediamtx
